# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Python 3.12+, FastAPI 0.135.1, SQLModel/SQLAlchemy, Azure SQL Server, Angular 18.2+
  Architecture: Multi-tenant REST API (FastAPI) + Angular SPA with lazy-loaded modules. Auth: Azure AD OAuth2 PKCE, JWT Bearer, password grant, contact token. CQRS-lite with models/schemas separation.
  Testing: pytest 9.0.2 (asyncio strict mode), TestClient with SQLite temp DB, Jasmine/Karma for Angular
  Style: Ruff (py312, 120col, google docstrings, ~50 rule families), mypy (ignore_missing_imports), codespell, TypeScript strict mode
  Frontend: Angular 18.2 standalone components, OnPush, Angular Material, MSAL 4.0.1, RxJS

strict_tdd: true

testing:
  backend:
    runner: pytest
    command: pytest
    framework: pytest 9.0.2
    asyncio_mode: strict
    unit: true
    integration: true
    integration_tool: TestClient + SQLite temp DB
    integration_fixtures: client, db_session, auth_headers, auth_overrides, current_employee, mock_upload_dirs
    coverage: false
    coverage_command: null
    test_files: 28
  frontend:
    runner: karma
    command: ng test
    framework: Jasmine + Karma
    angular_testbed: true
    unit: true
    integration: false
    integration_tool: null
    e2e: false
    coverage: false
    coverage_command: null
    test_files: 32

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    tdd: true
    test_command: pytest tests/
    build_command: null
  verify:
    test_command: pytest tests/
    build_command: null
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)
