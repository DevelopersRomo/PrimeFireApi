[project]
name = "Primefire-api"
version = "0.2.0"
requires-python = ">=3.12"
description = "This is the PrimeFire API"
authors = [
    { name="Juan VIlla", email="jcarlos.villa.rivera@gmail.com" }
]
license = { text = "MIT" }


[tool.ruff]
exclude = [
    "venv", ".venv", "alembic",
    "skills", ".claude", "tests",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
target-version = "py312"

# Add format settings
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Allow Preview mode
preview = true
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "W",     # pycodestyle warnings
    "B",     # flake8-bugbear
    "N",     # pep8-naming
    "D",     # pydocstyle
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "G",     # flake8-logging-format
    "RET",   # flake8-return
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PL",    # pylint
    "RUF",   # Ruff-specific rules
    "Q",     # flake8-quotes
    "PIE",   # flake8-pie
    "ASYNC", # flake8-async
    "ANN",   # flake8-annotations
    "UP",    # pyupgrade
    "YTT",   # flake8-2020
    "BLE",   # flake8-blind-except
    "FBT",   # flake8-boolean-trap
    "COM",   # flake8-commas
    "CPY",   # flake8-copyright
    "DTZ",   # flake8-datetimez
    "T10",   # flake8-debugger
    "DJ",    # flake8-django
    "EM",    # flake8-errmsg
    "EXE",   # flake8-executable
    "FA",    # flake8-future-annotations
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "LOG",   # flake8-logging
    "INP",   # flake8-no-pep420
    "T20",   # flake8-print
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "RSE",   # flake8-raise
    "SLF",   # flake8-self
    "SLOT",  # flake8-slots
    "TID",   # flake8-tidy-imports
    "TCH",   # flake8-type-checking
    "INT",   # flake8-gettext
    "PTH",   # flake8-use-pathlib
    "TD",    # flake8-todos
    "FIX",   # flake8-fixme
    "ERA",   # eradicate
    "PD",    # pandas-vet
    "PGH",   # pygrep-hooks
    "TRY",   # tryceratops
    "FLY",   # flynt
    "NPY",   # NumPy-specific rules
    "PERF",  # Perflint
    "FURB",  # refurb
    # "DOC",   # pydoclint
]
ignore = [
    "PTH208",
    "ARG001", "INP001", "D205", "E402", "PLC0415", "ERA001", "B904", "N806",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "FBT001", "FBT002", "FBT003", "PLR0917", "PLR0914", "PLR0915", "PLR0911", "PLR1702", "TRY003", "TRY300", "TRY401", "PT018", "PT019",
    "D206",     # Docstring is over-indented
    "D212",     # Multi-line docstring summary should start at the first line
    "Q000",     # Remove bad quotes
    "Q001",     # Remove bad quotes
    "Q002",     # Remove bad quotes
    "Q003",     # Remove bad quotes
    "W191",     # Remove trailing whitespace
    "D104",     # Missing docstring in public package
    "D107",     # Missing docstring in `__init__`
    "E501",     # Never enforce `E501` (line length violations).
    "N815",     # Never enforce `N815` (Variable {name} in class scope should not be mixedCase).
    "G004",     # Logging statement uses f-string
    "PLR0912",  # Too many branches (16 > 12)
    "PLR2004",  # Magic value used in comparison, consider replacing 200 with a constant variable
    "B008",     # Do not perform function call `Depends` in argument defaults
    "A002",     # Argument `id` is shadowing a python builtin
    "A003",     # Class attribute `id` is shadowing a python builtin
    "D404",     # First word of the docstring should not be "This"
    "D401",     # First line of docstring should be in imperative mood
    "D107",     # Missing docstring in `__init__`
    "PLR0913",  # Too many nested blocks (6 > 5)
    "RUF012",   # Mutable class attributes should be annotated with `typing.ClassVar`
    "BLE001",   # Blind except
    "CPY001",   # Missing copyright notice at top of file
    "RUF029",   # Function is declared `async`, but doesn't `await` or use `async` features.
    "PLR6301",  # Method `validate_roles` could be a function, class method, or static method
    "ISC001",   # Implicit string concatenation
    "COM812",   # Commas should be used to separate items in a list
    "TRY301",   # Abstract `raise` to an inner function
    "TRY003",   # ValueError
    "EM101",    # Exception message must be a variable
    "EM102",    # Exception message must be a variable
    "PT028"    # Remove default argument
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ignore `E402` (import violations) in the following files:
[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["INP001", "D100", "D103","D415","PLR0915"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:permit.*:",
    "ignore::DeprecationWarning:pytest_asyncio.plugin:",
    "ignore::DeprecationWarning:jsonschema.*",
    "ignore::DeprecationWarning:schemathesis.*",
]

[tool.codespell]
skip = "bd/sql/backups,venv,.venv,docs,*.md"
count = true
ignore-words-list = "MOR, Calle, Infarction, nin, LIEN, responsable, momento, Comercial, Lien, OT, RepId, Cliente, cliente, Anual, bulle, TE, mis, caracteres, ser, requiere, visibles, acording, waranty, asigned, informacion, posible, hace, te"

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["skills"]
disable_error_code = [
    "arg-type",
    "union-attr",
    "attr-defined",
    "assignment",
    "index",
    "operator",
    "var-annotated",
]
[[tool.mypy.overrides]]
module = ["marker.*", "bson.*"]
follow_untyped_imports = true
